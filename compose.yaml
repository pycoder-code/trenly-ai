services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: trenly
      POSTGRES_PASSWORD: trenly
      POSTGRES_DB: trenly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trenly -d trenly"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
