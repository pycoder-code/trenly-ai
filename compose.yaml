services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: trenly
      POSTGRES_PASSWORD: trenly
      POSTGRES_DB: trenly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trenly -d trenly"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  redis_data:
