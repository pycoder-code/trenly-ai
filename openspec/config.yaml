schema: spec-driven

context: |
  Trenly — сервис для персональных фитнес-тренеров и их клиентов.
  Тренер платит ежемесячную подписку и работает в веб-кабинете.
  Клиент бесплатно работает только через Telegram-бота.
  В сервисе много тренеров, каждый видит только своих клиентов.
  Клиент подключён ровно к одному тренеру.
  У нового тренера пробный период со всеми функциями. Без активной подписки
  клиенты тренера могут только просматривать свои статусы и графики.
  КБЖУ по фото распознаётся через OpenRouter, модель google/gemini-3.8-flash (ADR 0004).
  Пользователи в России: персональные данные хранятся в РФ (152-ФЗ).
  Платная подписка реализуется последней, после пилота с бесплатными тренерами.
  Монорепозиторий: docs/ — документация, backend/ — Django + DRF + PostgreSQL:
  API кабинета, Telegram-бот, админка на Django Admin; frontend/ — Vue 3 + TypeScript
  + PrimeVue: кабинет тренера. Клиент API генерируется из OpenAPI (drf-spectacular).
  Спецификации (specs/) — функциональные требования: поведение, проверяемое снаружи.
  Детали реализации описываются в design.md изменения.

  Язык документов — русский. Ключевые слова формата OpenSpec
  (Requirement, Scenario, SHALL, MUST, WHEN, THEN, AND) остаются на английском.

  Источники контекста:
  - процесс: docs/spec-driven-process.md
  - термины: docs/glossary.md
  - бизнес-требования: docs/business/requirements.md
  - архитектура: docs/architecture/
  - нефункциональные требования: docs/nfr/

  Планируемые capability (имена папок в openspec/specs/):
  trainer-subscription (BR-001), client-onboarding (BR-002),
  client-questionnaire (BR-003), nutrition-diary (BR-004),
  nutrition-recommendations (BR-005), workouts-attendance (BR-006),
  rewards (BR-007), notifications (BR-008), trainer-dashboard (BR-009),
  journal-reports (BR-010), trainer-admin (BR-011).

rules:
  proposal:
    - Указывай идентификаторы бизнес-требований (BR-xxx), которые закрывает изменение
    - Перечисляй затронутые части: backend, frontend, docs
  specs:
    - Каждое требование содержит строку «Источник: BR-xxx»
    - Сценарии описывай от лица конкретной роли (тренер, клиент или администратор)
    - Используй термины из docs/glossary.md
    - Учитывай ограничения доступа из docs/nfr/security.md и требования к данным из docs/nfr/privacy.md
    - Не описывай детали реализации — они идут в design.md
  design:
    - Описывай изменения отдельно для backend и frontend
    - Изменения API отражай в OpenAPI-контракте бэкенда
    - Если меняется архитектура, обнови нужный уровень в docs/architecture/c4/ и добавь ADR
  tasks:
    - Группируй задачи по частям: backend, frontend, docs
    - Задачи на API-контракт ставь перед задачами фронтенда
    - Добавляй задачи на тесты для каждого сценария
